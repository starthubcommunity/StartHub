name: Start-Hub Content Automation

on:
  schedule:
    # Her saat ":07"de çalışır (tam saat başı ":00" GitHub'da en yoğun an olduğu
    # için tetiklemeler orada daha sık gecikiyor/düşüyor — GitHub'ın kendi önerisi
    # saat başından kaydırmak). Python tarafı preferred_run_hours'a göre "telafili"
    # kontrol yapar: hedef saat geçtiyse ve henüz üretim yapılmadıysa üretir, bu
    # yüzden GitHub bu tetiklemeyi de geciktirse/atlasa bile bir sonraki çalışan
    # tetikleme telafi eder.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Çalışma modu"
        required: false
        default: "all"
        type: choice
        options: [all, generate]

permissions:
  contents: read   # Supabase'e yazıyoruz, repoya commit gerekmez

jobs:
  automate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıklar
        run: pip install -r automation/requirements.txt

      - name: İçerik hattını çalıştır
        working-directory: automation
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:         gemini-2.5-flash
          DAILY_LIMIT:          "2"
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          # Manuel tetiklemede saat kontrolünü atla
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python run.py "$MODE" --ignore-hour
          else
            python run.py "$MODE"
          fi
