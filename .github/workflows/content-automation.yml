name: Start-Hub Content Automation

# Cron zamanlama şimdilik devre dışı.
# Aktif etmek için aşağıdaki satırların başındaki # işaretini kaldır:
#  schedule:
#    - cron: "0 5 * * *"   # 08:00 TRT (UTC+3) = 05:00 UTC
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Çalışma modu"
        required: false
        default: "all"
        type: choice
        options: [all, generate, publish]

permissions:
  contents: read   # Supabase'e yazıyoruz, repoya commit gerekmez

jobs:
  automate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıklar
        run: pip install -r automation/requirements.txt

      - name: İçerik hattını çalıştır
        working-directory: automation
        env:
          GEMINI_API_KEY:             ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:               gemini-2.5-flash
          DAILY_LIMIT:                "2"
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:       ${{ secrets.SUPABASE_SERVICE_KEY }}
          SHEET_NAME:                 "Start-Hub Yayın Planı"
          GOOGLE_SHEETS_CREDENTIALS:  ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python run.py ${{ github.event.inputs.mode || 'all' }}
